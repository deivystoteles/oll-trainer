<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenador OLL</title>
  <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>
  <div id="login">
    <form id="login-form" class="login-box">
      <h2>OLL Trainer</h2>
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="aviso"></div>

  <div id="detalles-wrap">
    <div class="barra">
      <button id="btn-detalles">Ver detalles</button>
      <button id="btn-config" title="Configuración">⚙</button>
    </div>
    <div id="config" hidden>
      <div class="cfg-label">Color de la capa de arriba</div>
      <div id="colores"></div>
      <button id="btn-lista">▦ Ver todos los algoritmos</button>
      <button id="btn-logout">⏻ Cerrar sesión</button>
    </div>
    <div id="detalles" hidden></div>
  </div>

  <div id="vista-lista" hidden>
    <div class="lista-head">
      <h2>Todos los algoritmos</h2>
      <button id="btn-cerrar-lista" title="Cerrar (Esc)">✕</button>
    </div>
    <div id="filtros"></div>
    <div id="grid-algs"></div>
  </div>

  <main>
    <twisty-player
      id="cubo"
      puzzle="3x3x3"
      visualization="3D"
      experimental-stickering="full"
      control-panel="none"
      background="none"
      hint-facelets="none"
      camera-latitude="58"
      camera-longitude="0"
      camera-latitude-limit="90">
    </twisty-player>

    <div class="acciones">
      <button id="btn-fallo" title="No lo armé (←)">✗</button>
      <button id="siguiente" title="Saltar sin registrar (Espacio)">➜</button>
      <button id="btn-ok" title="Lo recordé (→)">✓</button>
    </div>
  </main>

  <!-- Datos: define el global OLL -->
  <script src="oll-data.js"></script>
  <!-- Aplicación (módulos ES) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
